name: Shared tools and phenotype helpers
# Called by ci.yml with the run's single scope plan; it never discovers scope itself.
on:
  workflow_call:
    inputs:
      plan:
        description: Compact JSON plan from tools/ci_scope.py
        type: string
        required: true
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os }} ${{ matrix.group }}
    if: fromJSON(inputs.plan).helperMatrix[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan).helperMatrix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Scope already diffed history; tests read only HEAD and the index. The plan's cone-mode sparse set is
      # testCheckout from tools/ci-scope.json, root files and only the packs this leg's tests reach; blob:none
      # downloads nothing else. The runner fails the leg if a test touches an omitted pack.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ matrix.checkout }}
          filter: blob:none
      - uses: actions/setup-python@v6
        id: interpreter
        with:
          python-version: '3.12'
      - uses: ./.github/actions/srn-tools
      - name: Install helper dependencies with the selected interpreter
        shell: pwsh
        run: '& ''${{ steps.interpreter.outputs.python-path }}'' -m pip install -r tools/phenotypes/requirements.txt -r tools/headkit/requirements.txt'
      - name: Run the selected tests from their import roots
        shell: pwsh
        env:
          TESTS: ${{ toJSON(matrix.tests) }}
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'selected-tests.json'
          [IO.File]::WriteAllText($list, $env:TESTS)
          & '${{ steps.interpreter.outputs.python-path }}' -B tools/test_impact.py --tests-from $list --timings (Join-Path $env:RUNNER_TEMP 'test-timings.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload per-test durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/test-timings.json
          if-no-files-found: ignore
          retention-days: 14

  item-import:
    name: item-import ${{ matrix.os }}
    # The only owner of Test-ItemImportTools.ps1; verification and test shards never run it.
    if: fromJSON(inputs.plan).itemImport
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.plan).operatingSystems }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # The regressions copy tools into a .quarantine fixture; they read no docs or packs.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            tools
          filter: blob:none
      - uses: ./.github/actions/srn-tools
      - name: Item import regressions
        shell: pwsh
        run: ./tools/Test-ItemImportTools.ps1

  wheel:
    name: wheel
    if: fromJSON(inputs.plan).wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/phenomorpher
          filter: blob:none
      - uses: actions/setup-python@v6
        id: interpreter
        with:
          python-version: '3.12'
      - name: Build, install and test PhenoMorpher outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/phenomorpher-wheel"
          mkdir -p "$work/dist" "$work/cwd"
          '${{ steps.interpreter.outputs.python-path }}' -m pip wheel --no-deps tools/phenomorpher -w "$work/dist"
          '${{ steps.interpreter.outputs.python-path }}' -m venv "$work/venv"
          venv="$work/venv/bin/python"
          "$venv" -m pip install "$work"/dist/*.whl
          cd "$work/cwd"
          # -I drops the checkout, cwd, PYTHONPATH and user site, so only the installed wheel can be imported.
          site=$("$venv" -I -c 'import pathlib,phenomorpher,sysconfig;p=pathlib.Path(phenomorpher.__file__).resolve();s=pathlib.Path(sysconfig.get_paths()["purelib"]).resolve();assert p.is_relative_to(s),(p,s);print(s)')
          "$venv" -I -m unittest discover -s "$site/phenomorpher" -t "$site" -v
          "$work/venv/bin/phenomorpher" --help > /dev/null
