name: Shared tools and phenotype helpers
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bind the explicit CI cache root
        shell: pwsh
        run: |
          $taskCacheRoot = Join-Path $env:RUNNER_TEMP 'srn-shared-tools'
          "SRN_TOOLS_ROOT=$taskCacheRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v6
        id: interpreter
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ${{ env.SRN_TOOLS_ROOT }}
          key: srn-tools-${{ runner.os }}-${{ hashFiles('tools/toolchain.lock.json', 'tools/shared-tools.lock.json') }}
      - name: Install helper dependencies with the selected interpreter
        shell: pwsh
        run: '& ''${{ steps.interpreter.outputs.python-path }}'' -m pip install -r tools/phenotypes/requirements.txt'
      - name: Bootstrap byte-verified shared utilities
        shell: pwsh
        run: ./tools/Bootstrap-Tools.ps1
      - name: Resolver, installation, retirement and clean-checkout tests
        shell: pwsh
        run: |
          & '${{ steps.interpreter.outputs.python-path }}' -B -m unittest discover -s tools -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Full extracted and existing phenotype regressions
        shell: pwsh
        run: |
          & '${{ steps.interpreter.outputs.python-path }}' -B -m unittest discover -s tools/phenotypes -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Meshy robe trial helper regressions
        shell: pwsh
        run: |
          & '${{ steps.interpreter.outputs.python-path }}' -B -m unittest discover -s tools/robes -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Decide whether item import changed
        id: items
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/Test-ItemImportScope.ps1 -BaseSha $env:BASE_SHA
      - name: Item import regressions
        if: steps.items.outputs.run == 'true'
        shell: pwsh
        run: ./tools/Test-ItemImportTools.ps1
