name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - name: Bind the explicit CI cache root
        shell: pwsh
        run: |
          $taskCacheRoot = Join-Path $env:RUNNER_TEMP 'srn-shared-tools'
          "SRN_TOOLS_ROOT=$taskCacheRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache verified tool archive and extraction
        uses: actions/cache@v6
        with:
          path: ${{ env.SRN_TOOLS_ROOT }}
          key: srn-tools-linux-${{ hashFiles('tools/toolchain.lock.json', 'tools/shared-tools.lock.json') }}
      - name: Verify repository
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0+$') {
            ./tools/Test-Repository.ps1 -AllPacks *>&1 | Tee-Object -FilePath verify.log
          }
          else {
            ./tools/Test-Repository.ps1 -ChangedSince $env:BASE_SHA *>&1 | Tee-Object -FilePath verify.log
          }
      - name: Verify item import regressions
        shell: pwsh
        run: ./tools/Test-ItemImportTools.ps1
      - name: Upload compact verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-log
          path: verify.log
          if-no-files-found: ignore
          retention-days: 7
